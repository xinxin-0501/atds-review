name: ATDS Daily A-share Review

on:
  # 本地/自动化推送到 main 后立即构建并部署(用仓库已有 json,不重复采集)
  push:
    branches: [main]
  # 高频探测:工作日北京 08:00-16:59 每 10 分钟触发一次(UTC 0-8 时),窗口内且报告缺失才真正采集,大幅提高定时可靠性
  # v11.61:盘中槽位停用后,真正会采集的窗口只剩三个:
  #   盘前 09:36~10:15(09:30 为竞价快照;10:00 后采集会标 lateCapture) / 竞价 09:25~09:35 / 收盘 16:10~17:30。
  #   cron 仍保留 0-8 时(UTC)全覆盖 —— 收紧小时段收益有限,而**漏掉窗口的代价是整天没报告**
  #   (2026-09-15 已有惨痛先例:schedule 稀疏 + 窗口全错过)。宁可多几次空转,不可漏窗口。
  schedule:
    - cron: '*/10 0-8 * * 1-5'   # 北京 08:00-16:59 每 10 分钟
    - cron: '0 9 * * 1-5'        # 北京 17:00 收盘兜底
    - cron: '30 9 * * 1-5'       # 北京 17:30 收盘最后兜底(v11.61 加;close 窗口上边界 17:30)
  workflow_dispatch:
    inputs:
      type:
        description: '报告类型(留空则按时间自动判断)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - premarket
          - auction
          - close
          - midday   # v11.61:盘中已停用,仅保留用于补跑历史盘中报告
      date:
        description: '可选:补生成指定日期报告 YYYYMMDD(留空=当天;用于周末/非交易日补跑历史报告)'
        required: false
        default: ''
        type: string
  # 第三方 cron(cron-job.org 等)每 10 分钟触发,实现不开机也能云端自动更新
  repository_dispatch:
    types: [daily-review, trigger-run]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atds-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine report type
        id: type
        run: |
          INPUT_TYPE="${{ github.event.inputs.type }}"
          if [ -n "$INPUT_TYPE" ]; then echo "type=$INPUT_TYPE" >> "$GITHUB_OUTPUT";
          else
            HOUR=$(TZ='Asia/Shanghai' date +%H%M)
            HOUR=$((10#$HOUR))   # 去掉前导零,避免 bash 八进制解析错误
            if [ "$HOUR" -ge 925 ] && [ "$HOUR" -le 935 ]; then echo "type=auction" >> "$GITHUB_OUTPUT";
            # v11.71【容差闸】盘前判定上界 1001 → 1015。
            #   背景:实测第三方 cron(cron-job.org)当前是【30 分钟】节拍(只 :00/:30),盘前窗口内仅剩 10:00 一跳;
            #   而实测 dispatch(10:00:38)→ job 启动(10:00:41)→ checkout/setup-node 后 cloud_fetch 启动约 10:00:55,
            #   距边界 10:00 只剩几秒 ⇒ 一旦 GitHub 排队稍慢,云端的时刻守卫就会 exit(3),当天盘前整份缺失。
            #   上界放宽到 1015 后:10:00 那一跳有 15 分钟容差,稳过;
            #   服务端 SLOT_WINDOWS.premarket 仍为 08:30~10:00 ⇒ 10:00 之后采集会被标记 lateCapture=true,
            #   页面显示"补采/数据时间"告警,既不伪装成 09:45 原始采集,也不丢报告。
            elif [ "$HOUR" -lt 1015 ]; then echo "type=premarket" >> "$GITHUB_OUTPUT";
            # v11.75【尾盘定调快照】14:20~14:59 → tailscan:四大选股模块(形态/波背离/超短核心/强势股)
            #   提前到尾盘采集,供 14:30~15:00 筛选次日观察池候选。
            #   触发点取 14:20(10分钟节拍)而非 14:30:四大全市场扫描约需 8~10 分钟,
            #   14:20 启动 ≈ 14:30 完成,正好赶上尾盘 30 分钟;14:30/14:40/14:50 的触发会被
            #   「当日报告已存在」闸门幂等跳过,不会重复采集。
            elif [ "$HOUR" -ge 1420 ] && [ "$HOUR" -le 1459 ]; then echo "type=tailscan" >> "$GITHUB_OUTPUT";
            # v11.61:盘中槽位(midday/11-35)已停用 —— 盘中数据全部由收盘页承载。
            #   原逻辑 elif [ "$HOUR" -lt 1500 ] → midday,会在 09:55~14:59 每 10 分钟刷一次盘中快照;
            #   用户 2026-09-15 决策"盘中可以全部转移收盘"。此处改为:未到收盘窗口一律按 close 处理
            #   (close 的 Check time window 会判 16:10~17:30,窗口外的触发自然空转,不会多采)。
            else echo "type=close" >> "$GITHUB_OUTPUT"; fi
          fi
          echo "Type: input=[$INPUT_TYPE] -> ${{ steps.type.outputs.type }}"

      # 高频探测的窗口判断:schedule/repository_dispatch 触发时按窗口判断;手动 Run 与 push 不受窗口限制
      - name: Check time window (skip outside generation windows)
        id: win
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event_name }}" != "repository_dispatch" ]; then
            echo "手动/推送触发,不限制窗口"
            echo "inwin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ='Asia/Shanghai' date +%H%M)
          HOUR=$((10#$HOUR))   # 去掉前导零,避免 bash 八进制解析错误
          TYPE="${{ steps.type.outputs.type }}"
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          OK=0
          case "$TYPE" in
            premarket) [ "$HOUR" -ge 936 ] && [ "$HOUR" -le 1014 ] && OK=1 ;;
            # v11.75:尾盘定调快照窗口(14:20 触发 → ~14:30 完成;15:00 后今日K线定型,不能再叫盘中快照)
            tailscan) [ "$HOUR" -ge 1420 ] && [ "$HOUR" -le 1459 ] && OK=1 ;;
            auction) [ "$HOUR" -ge 925 ] && [ "$HOUR" -le 935 ] && OK=1 ;;
            close) [ "$HOUR" -ge 1610 ] && [ "$HOUR" -le 1730 ] && OK=1 ;;
            midday)
              # v11.61:盘中槽位已停用。此处只为兼容"手动指定 type=midday 补跑历史"而保留,
              #   且必须落在盘中时段内才执行(否则同一守卫会拒绝)。正常 schedule 不会再产出 midday。
              { [ "$HOUR" -ge 955 ] && [ "$HOUR" -le 1005 ]; } || { [ "$HOUR" -ge 1125 ] && [ "$HOUR" -le 1140 ]; } || { [ "$HOUR" -ge 1325 ] && [ "$HOUR" -le 1340 ]; } || { [ "$HOUR" -ge 1425 ] && [ "$HOUR" -le 1440 ]; } && OK=1 ;;
          esac
          # v11.57 自愈式回填, v11.60 收敛(重要):
          #   v11.57 原逻辑"窗口外若某槽位当日缺失就补采",出发点是防【整天零产出】。但它把
          #   midday/premarket 也纳入回填 —— 而这两个槽位**只在特定时段有意义**,窗口外补出来的
          #   内容是"补采那一刻的行情"(实测 2026-09-15 18:49 采的 midday:上证=收盘价 3864.28、
          #   超短核心 17/20 是涨停),页面标称「11:35 盘中」,实际是收盘 —— 比没有数据更坏。
          #   v11.60 起:①close 仍可回填(15:00 后收盘数据语义不再变化,拦它只会让某天彻底没报告);
          #             ②midday / premarket **不再回填**,宁可槽位留空(页面显示"未采集"),
          #               也不写进别的时段的盘面;
          #             ③cloud_fetch.mjs 的 slotGuardF 同时做了服务端硬拦截(exit 3),
          #               此处收敛是"第一道闸",脚本内守则是"第二道闸",双保险。
          CATCHUP=""
          if [ "$OK" != "1" ] && [ "$TYPE" != "auction" ]; then
            if [ "$HOUR" -ge 1610 ] && [ ! -f "data/reviews/${TODAY}_16-20.json" ]; then CATCHUP="close"
            fi
          fi
          if [ "$OK" = "1" ]; then
            echo "时间窗口命中: $TYPE @ $HOUR 北京,执行采集"
            echo "inwin=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$CATCHUP" ]; then
            echo "窗口外回填: $CATCHUP @ $HOUR 北京,当日槽位缺失 → 补采"
            echo "inwin=true" >> "$GITHUB_OUTPUT"
            echo "catchup=$CATCHUP" >> "$GITHUB_OUTPUT"
          else
            echo "时间窗口外: $TYPE @ $HOUR 北京,空转跳过"
            echo "inwin=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if today's report already exists (schedule/repository_dispatch; manual run always re-generates)
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event_name }}" != "repository_dispatch" ]; then
            echo "手动/推送触发,不跳过"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          case "${{ steps.type.outputs.type }}" in
            auction)
              # v11.52:竞价快照每交易日一次即可;当天已存在则跳过(幂等),不参与"今日报告已存在"逻辑
              if [ -f "data/auction_cache.json" ] && grep -q "$(TZ='Asia/Shanghai' date +%Y-%m-%d)" data/auction_cache.json; then
                echo "今日竞价快照已存在,跳过"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "竞价快照采集,不跳过"; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            premarket) FT="09:45";;
            # v11.75:尾盘定调快照幂等 —— 当日已采则跳过(14:30/14:40/14:50 的节拍不会重复跑)
            tailscan) FT="14:30";;
            midday)
              # 午盘盘中更新:10:00/11:30/13:30/14:40 四次刷新,不跳过(覆盖最新数据)
              echo "午盘盘中更新,不跳过(每次刷新最新数据)"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            close) FT="16:20";;
            *) FT="09:45";;
          esac
          FN="${TODAY}_${FT//:/-}.json"
          if [ -f "data/reviews/${FN}" ]; then
            echo "今天 ${TODAY} ${FT} 报告已存在,跳过采集"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "今天 ${TODAY} ${FT} 报告缺失,执行采集"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync latest code from repo root to scripts (GitHub web upload 到根目录)
        if: steps.check.outputs.skip != 'true' && steps.win.outputs.inwin == 'true'
        run: |
          for f in cloud_fetch.mjs build_report.js shared_client.js modal_css.txt inject_client.js hero_mobile.css; do
            if [ -f "$f" ]; then cp -f "$f" "scripts/$f"; echo "synced scripts/$f"; fi
          done
          # 全A股票列表在仓库根目录,脚本读取 data/stock_list.json,需同步
          if [ -f "stock_list.json" ]; then cp -f "stock_list.json" "data/stock_list.json"; echo "synced data/stock_list.json"; fi

      # P2 事件数据源(可选主源 AKShare,仅盘前跑一次生成 events_cache.json;失败降级到 cloud_fetch.mjs 内巨潮直连)
      - name: Setup Python for event source (AKShare)
        if: steps.check.outputs.skip != 'true' && steps.win.outputs.inwin == 'true' && github.event_name != 'push' && steps.type.outputs.type == 'premarket'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Fetch events via AKShare (best-effort, fallback to cninfo direct)
        if: steps.check.outputs.skip != 'true' && steps.win.outputs.inwin == 'true' && github.event_name != 'push' && steps.type.outputs.type == 'premarket'
        continue-on-error: true
        run: |
          pip install -q akshare || echo "[events] akshare install failed, will fallback to cninfo direct"
          python scripts/fetch_events.py || echo "[events] fetch_events.py failed, will fallback to cninfo direct"

      - name: Fetch market data
        if: steps.check.outputs.skip != 'true' && steps.win.outputs.inwin == 'true' && github.event_name != 'push'
        run: |
          TYPE="${{ steps.win.outputs.catchup }}"
          if [ -z "$TYPE" ]; then TYPE="${{ steps.type.outputs.type }}"; else echo "补采缺失槽位: $TYPE"; fi
          DATE_ARG="${{ github.event.inputs.date }}"
          # v11.54:盘中一律写规范槽位 midday(= 11:35),不再按当前时刻生成
          #   10:00/11:30/13:30/14:40 四个**不同文件名** —— 那与"每日三槽位(盘前/盘中/收盘)"的
          #   导航不一致,还会每天多留 4 个 json + 4 个 html 在仓库里(此前只因被本地全量推送
          #   误删才没被发现)。实际数据时点由 meta.generatedAt 记录并在页面标头显示,
          #   不需要靠文件名区分;盘中四次触发依然是四次刷新,只是覆盖同一个文件。
          echo "采集类型: $TYPE @ $(TZ='Asia/Shanghai' date +%H:%M) 北京"
          node --dns-result-order=ipv4first scripts/cloud_fetch.mjs "$TYPE" $DATE_ARG

      - name: Build report HTML
        if: steps.check.outputs.skip != 'true' && steps.win.outputs.inwin == 'true' && steps.type.outputs.type != 'auction'
        run: node scripts/build_report.js

      - name: Inject CSS and shared client JS
        if: steps.check.outputs.skip != 'true' && steps.win.outputs.inwin == 'true' && steps.type.outputs.type != 'auction'
        run: node scripts/inject_client.js

      - name: Flatten site to repository root (flat layout)
        if: steps.check.outputs.skip != 'true' && steps.win.outputs.inwin == 'true' && steps.type.outputs.type != 'auction'
        run: |
          python3 - <<'PY'
          import re, glob, shutil, os
          shutil.copy('site/index.html', 'index.html')
          shutil.copy('site/main-rank.html', 'main-rank.html')
          # 先列根目录已有 html
          existing_root = set(os.path.basename(x) for x in glob.glob('*.html'))
          site_basenames = set(os.path.basename(x) for x in glob.glob('site/*.html'))
          # 删除根目录不属于 site/ 的旧 html(避免历史残留导致 size 不一致)
          for old in list(existing_root):
              if old in ('index.html', 'main-rank.html'):
                  continue
              if old not in site_basenames:
                  print('remove stale root html:', old)
                  try:
                      os.remove(old)
                  except Exception as e:
                      print('remove fail:', old, e)
          # 复制所有 site/*.html 到根目录
          for f in glob.glob('site/*.html'):
              bn = os.path.basename(f)
              if bn in ('index.html', 'main-rank.html'):
                  continue
              shutil.copy(f, bn)
              print('flatten ->', bn, os.path.getsize(f))
          # 兼容 site/reviews/ 残留(扁平化)
          for f in glob.glob('site/reviews/*.html'):
              bn = os.path.basename(f)
              shutil.copy(f, bn)
              print('flatten(reviews) ->', bn)
          # 重写 index.html 内 reviews/xxx.html -> xxx.html
          c = open('index.html', encoding='utf-8').read()
          for m in re.findall(r'reviews/[\w\-]+\.html', c):
              c = c.replace(m, m.replace('reviews/', ''))
          open('index.html', 'w', encoding='utf-8').write(c)
          # 软校验:打印 site/ 与根目录 size 对比,不 assert exit(避免 workflow fail)
          mismatches = []
          for f in glob.glob('site/*.html'):
              bn = os.path.basename(f)
              if bn in ('index.html', 'main-rank.html'):
                  continue
              if os.path.exists(bn):
                  if os.path.getsize(f) != os.path.getsize(bn):
                      mismatches.append((bn, os.path.getsize(f), os.path.getsize(bn)))
          if mismatches:
              print('MISMATCH detected:')
              for bn, s, r in mismatches:
                  print(f'  {bn} site={s} root={r}')
              # 强制再次复制一次
              for bn, s, r in mismatches:
                  for sf in glob.glob('site/*.html'):
                      if os.path.basename(sf) == bn:
                          shutil.copy(sf, bn)
                          print('  recopied:', bn, 'now root=', os.path.getsize(bn))
          print('flattened OK')
          PY

      - name: Commit updated data and site
        if: steps.check.outputs.skip != 'true' && steps.win.outputs.inwin == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ATDS daily A-share review $(TZ='Asia/Shanghai' date +%Y-%m-%d-%H%M)" || echo "No changes to commit"
          # v11.35: 外部 REST 推送(人工改代码)可能在本 run 构建期间推进远端,导致 push 被拒。
          # v11.72 修:原实现用 `git pull --rebase --autostash` —— 实测**必然冲突**并让整轮失败。
          #   原因:`site/*.html` 是本 run 全量重建的产物,而且 hero 里带"约 N 分钟前"这种**按构建时刻计算**的
          #   相对时间 ⇒ 任何两次重建的同一文件都不可能逐字节相同 ⇒ rebase 把每一个 html 都判成 CONFLICT,
          #   rebase 中断 → 提交步骤红 X → **本次采集的数据全部丢弃**(实测 2026-09-17 03:19 那一轮)。
          #   改法:push 失败时用 `git merge -X ours`(冲突处保留**本 run 刚构建的产物**;非冲突的远端改动照常并入,
          #   远程独有的新文件也不会丢),循环重试 3 次。绝不 force push。
          PUSHED=0
          for i in 1 2 3; do
            if git push; then echo "push ok(第 $i 次尝试)"; PUSHED=1; break; fi
            echo "push 被拒(第 $i 次),fetch + merge -X ours 后重试"
            git fetch origin main
            if ! git merge -X ours --no-edit origin/main; then
              echo "merge 异常,回滚后重试"
              git merge --abort || true
              sleep 5
              continue
            fi
            sleep 3
          done
          if [ "$PUSHED" != "1" ]; then
            echo "!! 三次重试后仍未推送成功 —— 本次数据未落盘,请人工检查"
            exit 1
          fi

      - name: Upload Pages artifact
        if: steps.check.outputs.skip != 'true' && steps.win.outputs.inwin == 'true' && steps.type.outputs.type != 'auction'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.skip != 'true' && steps.win.outputs.inwin == 'true' && steps.type.outputs.type != 'auction'
        uses: actions/deploy-pages@v4
